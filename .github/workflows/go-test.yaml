name: go-test
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: golangci/golangci-lint-action@v9

      - run: go test --cover ./...
