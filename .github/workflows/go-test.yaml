name: go-test
on: [push]
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/checkout@v7

      - uses: golangci/golangci-lint-action@v9

      - run: go test --cover ./...
